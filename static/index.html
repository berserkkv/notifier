<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notifier</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css" />

  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a2332;
      --text: #e7ecf3;
      --muted: #8b98a8;
      --accent: #3b82f6;
      --ok: #22c55e;
      --err: #ef4444;
      --border: #2d3a4d;
      font-family: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(1200px 600px at 20% -10%, #1e3a5f 0%, transparent 50%), var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 2rem 1rem;
    }

    main { max-width: 640px; margin: 0 auto; }

    h1 { font-size: 1.5rem; font-weight: 600; margin: 0 0 0.5rem; }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem 1.35rem;
      margin-bottom: 1.25rem;
    }

    label {
      display: block;
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 0.35rem;
    }

    input, select {
      width: 100%;
      padding: 0.55rem 0.65rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #0f1824;
      color: var(--text);
      margin-bottom: 0.85rem;
    }

    button {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 0.65rem 1rem;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
    }

    button:hover { filter: brightness(1.08); }

    .status {
      padding: 0.65rem 0.85rem;
      border-radius: 8px;
      font-size: 0.85rem;
      margin-bottom: 1rem;
    }

    .status.ok {
      background: rgba(34, 197, 94, 0.12);
      color: var(--ok);
      border: 1px solid rgba(34, 197, 94, 0.35);
    }

    .status.err {
      background: rgba(239, 68, 68, 0.12);
      color: var(--err);
      border: 1px solid rgba(239, 68, 68, 0.35);
    }

    .muted { color: var(--muted); font-size: 0.82rem; }

    ul.alerts {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    ul.alerts li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      padding: 0.65rem 0;
      border-bottom: 1px solid var(--border);
      font-size: 0.9rem;
    }

    ul.alerts li:last-child { border-bottom: none; }

    .del {
      flex-shrink: 0;
      width: auto;
      padding: 0.35rem 0.6rem;
      font-size: 0.78rem;
      background: transparent;
      color: var(--err);
      border: 1px solid rgba(239, 68, 68, 0.45);
    }

    code {
      font-size: 0.85em;
      background: #0f1824;
      padding: 0.1em 0.35em;
      border-radius: 4px;
    }

    .price-hint {
      font-size: 0.82rem;
      color: var(--muted);
      margin: -0.45rem 0 0.75rem;
      min-height: 1.35em;
    }

    .price-hint.err { color: var(--err); }

    .chain-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      margin: 0 0 0.5rem;
    }

    #add-step {
      width: auto;
      padding: 0.35rem 0.75rem;
      font-size: 1.1rem;
      line-height: 1;
      background: #243044;
      border: 1px solid var(--border);
    }

    #add-step:hover { filter: brightness(1.12); }

    .step-row {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.75rem;
      margin-bottom: 0.75rem;
      background: #141c28;
    }

    .step-row-top {
      display: flex;
      align-items: flex-end;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .step-row-top .fld {
      flex: 1 1 100px;
      margin-bottom: 0;
    }

    .step-row-top input { margin-bottom: 0; }

    .dir-buttons {
      display: flex;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border);
      min-width: 6.75rem;
    }

    .dir-btn {
      flex: 1;
      padding: 0.55rem 0.65rem;
      margin: 0;
      border: none;
      border-radius: 0;
      width: auto;
      background: #0f1824;
      color: var(--muted);
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      line-height: 1;
    }

    .dir-btn + .dir-btn { border-left: 1px solid var(--border); }

    .dir-btn.pressed {
      background: var(--accent);
      color: #fff;
    }

    .dir-btn:not(.pressed):hover {
      background: #1e2d45;
      color: var(--text);
    }

    .step-num {
      font-size: 0.75rem;
      color: var(--muted);
      margin-bottom: 0.45rem;
      display: block;
    }

    .rm-step {
      flex: 0 0 auto;
      width: 2.25rem;
      padding: 0.5rem 0;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      font-weight: 700;
    }

    .rm-step:hover {
      color: var(--err);
      border-color: rgba(239, 68, 68, 0.45);
    }

    .flatpickr-calendar {
      background: #1a2332;
      border: 1px solid var(--border);
    }

    .flatpickr-time input {
      color: white !important;
    }
  </style>
</head>

<body>
  <main>
    <div id="telegram-status"></div>

    <div class="panel">
      <form id="form">
        <label for="symbol">Symbol (Binance)</label>
        <select id="symbol" name="symbol" required>
          <option value="BTCUSDT">BTCUSDT</option>
          <option value="ETHUSDT">ETHUSDT</option>
          <option value="BNBUSDT">BNBUSDT</option>
          <option value="SOLUSDT" selected>SOLUSDT</option>
          <option value="ADAUSDT">ADAUSDT</option>
          <option value="XRPUSDT">XRPUSDT</option>
        </select>

        <div class="chain-head" style="margin-top:1rem;">
          <button type="button" id="add-step">Add step</button>
        </div>

        <div id="price-hint" class="price-hint"></div>
        <div id="steps-container"></div>

        <button type="submit">Add alert</button>
      </form>
    </div>

    <div class="panel">
      <h2 style="font-size:1rem;margin:0 0 1rem;">Active alerts</h2>
      <ul id="list" class="alerts"><li class="muted">Loading…</li></ul>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

  <script>
    const container = document.getElementById("steps-container");

    function stepRowHTML() {
      return `
      <div class="step-row">
        <span class="step-num">Step</span>
        <div class="step-row-top">

          <div class="fld" style="min-width:10rem;">
            <label>Step type</label>
            <select class="step-type">
              <option value="price">Price target</option>
              <option value="line">Diagonal line</option>
            </select>
          </div>

          <div class="fld price-field">
            <label>Target (USDT)</label>
            <input type="number" class="step-target" step="any" min="0" required />
          </div>

          <div class="fld line-field" style="display:none;">
            <label>Point 1 price</label>
            <input type="number" class="line-price1" step="any" min="0" />
          </div>

          <div class="fld line-field" style="display:none;">
            <label>Point 1 date</label>
            <input type="date" class="line-date1" />
          </div>

          <div class="fld line-field" style="display:none;">
            <label>Point 1 time</label>
            <input type="text" class="line-time1 time-picker" placeholder="HH:MM" />
          </div>

          <div class="fld line-field" style="display:none;">
            <label>Point 2 price</label>
            <input type="number" class="line-price2" step="any" min="0" />
          </div>

          <div class="fld line-field" style="display:none;">
            <label>Point 2 date</label>
            <input type="date" class="line-date2" />
          </div>

          <div class="fld line-field" style="display:none;">
            <label>Point 2 time</label>
            <input type="text" class="line-time2 time-picker" placeholder="HH:MM" />
          </div>

          <div class="fld" style="min-width:7rem;">
            <label>Condition</label>
            <div class="dir-buttons">
              <button type="button" class="dir-btn pressed" data-direction="above">≥</button>
              <button type="button" class="dir-btn" data-direction="below">≤</button>
            </div>
          </div>

          <button type="button" class="rm-step">−</button>

        </div>
      </div>`;
    }

    function initFlatpickrForRow(row) {
      row.querySelectorAll(".time-picker").forEach((input) => {
        flatpickr(input, {
          enableTime: true,
          noCalendar: true,
          dateFormat: "H:i",
          time_24hr: true,
          allowInput: true
        });
      });
    }

    function renumberSteps() {
      const rows = container.querySelectorAll(".step-row");
      rows.forEach((row, i) => {
        row.querySelector(".step-num").textContent = "Step " + (i + 1);
      });
    }

    function setDirForRow(row, direction) {
      row.querySelectorAll(".dir-btn").forEach((b) => {
        b.classList.toggle("pressed", b.dataset.direction === direction);
      });
    }

    function wireDirButtons(row) {
      row.querySelectorAll(".dir-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          setDirForRow(row, btn.dataset.direction);
        });
      });
    }

    function setStepType(row, type) {
      row.querySelectorAll(".price-field").forEach(f => {
        f.style.display = type === "price" ? "" : "none";
      });

      row.querySelectorAll(".line-field").forEach(f => {
        f.style.display = type === "line" ? "" : "none";
      });
    }

    function wireTypeSelect(row) {
      const sel = row.querySelector(".step-type");
      sel.addEventListener("change", () => setStepType(row, sel.value));
    }

    function addStepRow() {
      container.insertAdjacentHTML("beforeend", stepRowHTML());
      const row = container.lastElementChild;

      initFlatpickrForRow(row);
      wireDirButtons(row);
      wireTypeSelect(row);

      row.querySelector(".rm-step").addEventListener("click", () => {
        if (container.children.length <= 1) return;
        row.remove();
        renumberSteps();
      });

      renumberSteps();
    }

    function resetStepsToOne() {
      container.innerHTML = "";
      addStepRow();
    }

    document.getElementById("add-step").addEventListener("click", addStepRow);

    resetStepsToOne();
  </script>
</body>
</html>
