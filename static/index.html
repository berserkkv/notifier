<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notifier</title>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a2332;
      --text: #e7ecf3;
      --muted: #8b98a8;
      --accent: #3b82f6;
      --ok: #22c55e;
      --err: #ef4444;
      --border: #2d3a4d;
      font-family: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(1200px 600px at 20% -10%, #1e3a5f 0%, transparent 50%), var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 2rem 1rem;
    }
    main { max-width: 640px; margin: 0 auto; }
    h1 { font-size: 1.5rem; font-weight: 600; margin: 0 0 0.5rem; }
    p.intro { color: var(--muted); margin: 0 0 1.5rem; font-size: 0.95rem; }
    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem 1.35rem;
      margin-bottom: 1.25rem;
    }
    label { display: block; font-size: 0.8rem; color: var(--muted); margin-bottom: 0.35rem; }
    input, select {
      width: 100%;
      padding: 0.55rem 0.65rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #0f1824;
      color: var(--text);
      margin-bottom: 0.85rem;
    }
    button {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 0.65rem 1rem;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
    }
    button:hover { filter: brightness(1.08); }
    .status {
      padding: 0.65rem 0.85rem;
      border-radius: 8px;
      font-size: 0.85rem;
      margin-bottom: 1rem;
    }
    .status.ok { background: rgba(34, 197, 94, 0.12); color: var(--ok); border: 1px solid rgba(34, 197, 94, 0.35); }
    .status.err { background: rgba(239, 68, 68, 0.12); color: var(--err); border: 1px solid rgba(239, 68, 68, 0.35); }
    .muted { color: var(--muted); font-size: 0.82rem; }
    ul.alerts { list-style: none; padding: 0; margin: 0; }
    ul.alerts li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      padding: 0.65rem 0;
      border-bottom: 1px solid var(--border);
      font-size: 0.9rem;
    }
    ul.alerts li:last-child { border-bottom: none; }
    .del {
      flex-shrink: 0;
      width: auto;
      padding: 0.35rem 0.6rem;
      font-size: 0.78rem;
      background: transparent;
      color: var(--err);
      border: 1px solid rgba(239, 68, 68, 0.45);
    }
    code { font-size: 0.85em; background: #0f1824; padding: 0.1em 0.35em; border-radius: 4px; }
    .price-hint {
      font-size: 0.82rem;
      color: var(--muted);
      margin: -0.45rem 0 0.75rem;
      min-height: 1.35em;
    }
    .price-hint.err { color: var(--err); }
    .chain-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      margin: 0 0 0.5rem;
    }
    .chain-head label { margin: 0; }
    #add-step {
      width: auto;
      padding: 0.35rem 0.75rem;
      font-size: 1.1rem;
      line-height: 1;
      background: #243044;
      border: 1px solid var(--border);
    }
    #add-step:hover { filter: brightness(1.12); }
    .step-row {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.75rem;
      margin-bottom: 0.75rem;
      background: #141c28;
    }
    .step-row-top {
      display: flex;
      align-items: flex-end;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .step-row-top .fld { flex: 1 1 100px; margin-bottom: 0; }
    .step-row-top input { margin-bottom: 0; }
    .dir-buttons {
      display: flex;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border);
      min-width: 6.75rem;
    }
    .dir-btn {
      flex: 1;
      padding: 0.55rem 0.65rem;
      margin: 0;
      border: none;
      border-radius: 0;
      width: auto;
      background: #0f1824;
      color: var(--muted);
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      line-height: 1;
    }
    .dir-btn + .dir-btn { border-left: 1px solid var(--border); }
    .dir-btn.pressed {
      background: var(--accent);
      color: #fff;
    }
    .dir-btn:not(.pressed):hover { background: #1e2d45; color: var(--text); }
    .step-num { font-size: 0.75rem; color: var(--muted); margin-bottom: 0.45rem; display: block; }
    .rm-step {
      flex: 0 0 auto;
      width: 2.25rem;
      padding: 0.5rem 0;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      font-weight: 700;
    }
    .rm-step:hover { color: var(--err); border-color: rgba(239, 68, 68, 0.45); }
  </style>
</head>
<body>
  <main>
    <div id="telegram-status"></div>

    <div class="panel">
      <form id="form">
        <label for="symbol">Symbol (Binance)</label>
        <select id="symbol" name="symbol" required>
          <option value="BTCUSDT">BTCUSDT</option>
          <option value="ETHUSDT">ETHUSDT</option>
          <option value="BNBUSDT">BNBUSDT</option>
          <option value="SOLUSDT" selected>SOLUSDT</option> 
          <option value="ADAUSDT">ADAUSDT</option>
          <option value="XRPUSDT">XRPUSDT</option>
        </select>

        <div class="chain-head" style="margin-top:1rem;">
          <button type="button" id="add-step" title="Add another step">Add step</button>
        </div>
        <div id="price-hint" class="price-hint"></div>
        <div id="steps-container"></div>

        <button type="submit">Add alert</button>
      </form>
    </div>

    <div class="panel">
      <h2 style="font-size:1rem;margin:0 0 1rem;">Active alerts</h2>
      <ul id="list" class="alerts"><li class="muted">Loading…</li></ul>
    </div>
  </main>
  <script>
    const container = document.getElementById("steps-container");

    function stepRowHTML() {
      return `
      <div class="step-row">
        <span class="step-num">Step</span>
        <div class="step-row-top">
          <div class="fld">
            <label style="margin-bottom:0.35rem;">Target (USDT)</label>
            <input type="number" class="step-target" step="any" min="0" required placeholder="price" />
          </div>
          <div class="fld" style="min-width:7rem;">
            <label style="margin-bottom:0.35rem;">Condition</label>
            <div class="dir-buttons" role="group" aria-label="Price condition vs target">
              <button type="button" class="dir-btn pressed" aria-pressed="true" data-direction="above" title="At or above target">≥</button>
              <button type="button" class="dir-btn" aria-pressed="false" data-direction="below" title="At or below target">≤</button>
            </div>
          </div>
          <button type="button" class="rm-step" title="Remove step">−</button>
        </div>
      </div>`;
    }

    function renumberSteps() {
      const rows = container.querySelectorAll(".step-row");
      rows.forEach((row, i) => {
        row.querySelector(".step-num").textContent = "Step " + (i + 1);
        const rm = row.querySelector(".rm-step");
        rm.style.visibility = rows.length > 1 ? "visible" : "hidden";
        rm.disabled = rows.length <= 1;
      });
    }

    function setDirForRow(row, direction) {
      const btns = row.querySelectorAll(".dir-btn");
      btns.forEach((b) => {
        const on = b.dataset.direction === direction;
        b.classList.toggle("pressed", on);
        b.setAttribute("aria-pressed", on ? "true" : "false");
      });
    }

    function getDirFromRow(row) {
      const p = row.querySelector(".dir-btn.pressed");
      return p ? p.dataset.direction : "above";
    }

    function wireDirButtons(row) {
      row.querySelectorAll(".dir-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          const d = btn.dataset.direction;
          if (d !== "above" && d !== "below") return;
          setDirForRow(row, d);
        });
      });
    }

    function addStepRow() {
      container.insertAdjacentHTML("beforeend", stepRowHTML());
      const rows = container.querySelectorAll(".step-row");
      const row = rows[rows.length - 1];
      wireDirButtons(row);
      row.querySelector(".rm-step").addEventListener("click", () => {
        if (container.querySelectorAll(".step-row").length <= 1) return;
        row.remove();
        renumberSteps();
      });
      renumberSteps();
    }

    function resetStepsToOne() {
      container.innerHTML = "";
      addStepRow();
    }

    async function fetchAndApplyCurrentPrice() {
      const hint = document.getElementById("price-hint");
      const firstTarget = container.querySelector(".step-row .step-target");
      const symbol = document.getElementById("symbol").value.trim().toUpperCase();
      hint.classList.remove("err");
      if (!symbol) {
        hint.textContent = "Pick a symbol first.";
        if (firstTarget) firstTarget.value = "";
        return;
      }
      if (!firstTarget) return;
      try {
        const r = await fetch("/api/price?symbol=" + encodeURIComponent(symbol));
        const text = await r.text();
        if (!r.ok) throw new Error(text || r.statusText);
        const j = JSON.parse(text);
        if (typeof j.price !== "number" || !(j.price > 0)) throw new Error("bad response");
        firstTarget.value = String(j.price);
         } catch (e) {
        hint.textContent =
          typeof e.message === "string"
            ? e.message
            : "Could not load price.";
        hint.classList.add("err");
      }
    }

    async function refreshStatus() {
      const el = document.getElementById("telegram-status");
      try {
        const r = await fetch("/api/status");
        const j = await r.json();
        if (!j.telegram_configured) {
          el.innerHTML = '<div class="status err">Telegram not configured — set <code>telegram_bot_token</code> / <code>telegram_chat_id</code> in <code>config.json</code> (see <code>config.example.json</code>) or the matching env vars, then restart.</div>';
        } else {
          el.innerHTML = '<div class="status ok">Telegram credentials loaded.</div>';
        }
      } catch {
        el.innerHTML = '';
      }
    }

    async function refreshAlerts() {
      const ul = document.getElementById("list");
      const r = await fetch("/api/alerts");
      const data = await r.json();
      if (!Array.isArray(data.alerts) || data.alerts.length === 0) {
        ul.innerHTML = '<li class="muted">No alerts yet.</li>';
        return;
      }
      ul.innerHTML = "";
      for (const a of data.alerts) {
        const li = document.createElement("li");
        const steps = Array.isArray(a.steps) ? a.steps : [];
        const idx = typeof a.step_index === "number" ? a.step_index : 0;
        const chainDone = steps.length > 0 && idx >= steps.length;
        const parts = steps.map((s, i) => {
          const op = s.direction === "below" ? "≤" : "≥";
          let mark = "";
          if (chainDone) mark = "✓ ";
          else if (i < idx) mark = "✓ ";
          else if (i === idx) mark = "→ ";
          return mark + op + s.target;
        });
        const summary = parts.length ? parts.join(" then ") : "(no steps)";
        const prog =
          steps.length === 0
            ? ""
            : chainDone
              ? `<span class="muted">(✓ chain done — notify pending)</span>`
              : `<span class="muted">(${idx + 1}/${steps.length})</span>`;
        li.innerHTML =
          `<span style="flex:1;min-width:0;"><strong>${String(a.symbol).replace(/</g, "")}</strong> ${prog} ` +
          summary +
          `</span>` +
          `<button type="button" class="del" data-id="${a.id}">Remove</button>`;
        ul.appendChild(li);
      }
      ul.querySelectorAll(".del").forEach((btn) => {
        btn.addEventListener("click", async () => {
          await fetch("/api/alerts?id=" + encodeURIComponent(btn.dataset.id), { method: "DELETE" });
          refreshAlerts();
        });
      });
    }

    document.getElementById("symbol").addEventListener("change", fetchAndApplyCurrentPrice);
    document.getElementById("add-step").addEventListener("click", () => {
      addStepRow();
    });

    document.getElementById("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const symbol = document.getElementById("symbol").value.trim().toUpperCase();
      const rows = container.querySelectorAll(".step-row");
      const steps = [];
      for (const row of rows) {
        const target = parseFloat(row.querySelector(".step-target").value);
        const direction = getDirFromRow(row);
        if (!Number.isFinite(target) || target <= 0) {
          alert("Each step needs a valid positive target price.");
          return;
        }
        steps.push({ target, direction });
      }
      const r = await fetch("/api/alerts", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ symbol, steps }),
      });
      if (!r.ok) {
        const t = await r.text();
        alert("Failed: " + t);
      } else {
        document.getElementById("form").reset();
        resetStepsToOne();
        fetchAndApplyCurrentPrice();
        refreshAlerts();
      }
    });

    resetStepsToOne();
    refreshStatus();
    fetchAndApplyCurrentPrice();
    refreshAlerts();
    setInterval(refreshAlerts, 5000);
  </script>
</body>
</html>
